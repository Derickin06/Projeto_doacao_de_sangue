# MySQL + API + site (frontend) em containers. Serve para o computador e para a EC2 da AWS.
#
#   docker compose up -d --build        # sobe tudo (em segundo plano)
#   docker compose logs -f api          # acompanha os logs da API
#   docker compose down                 # para (os dados do MySQL continuam no volume)
#
# Site: http://localhost:3000 (na AWS, porta 80) · API/Swagger: http://localhost:8000/docs
# Senhas e portas vêm do arquivo .env desta pasta (veja .env.example).
# Sem .env, usa os valores de desenvolvimento abaixo.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: doacao_sangue
      MYSQL_USER: doacao
      MYSQL_PASSWORD: ${DB_PASSWORD:-doacao}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    # Só acessível de dentro da própria máquina (nunca exposto na internet)
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_dados:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://doacao:${DB_PASSWORD:-doacao}@db:3306/doacao_sangue
      JWT_SECRET: ${JWT_SECRET:-chave-de-desenvolvimento-troque-em-producao}
      JWT_EXPIRA_MINUTOS: ${JWT_EXPIRA_MINUTOS:-720}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    # Acesso direto à API (Swagger). O site usa a API pelo próprio nginx, em /api.
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../frontend
    restart: unless-stopped
    # Na AWS o instalador usa WEB_PORT=80, para abrir o site sem porta no endereço
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  mysql_dados:
